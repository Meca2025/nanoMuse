# nanoMuse on DeepSeek Harness — the bundle (harness/dsh-nanomuse) as a package:
#
#   nanoMuse-Harness-<v>.tgz        what `dsh plugin --profile desktop add <file>` installs
#                                   into DeepSeek Harness Desktop (docs/harness.md, harness/README.md)
#
# A push or pull request that touches harness/ builds, typechecks and tests the bundle; a
# release tag `v*` also packs it and attaches the tarball and its checksum to the release of
# the same name — the one scripts/release-apk.sh creates with the APK — retrying until it
# exists. "Run workflow" with a release tag does the same for a release that already exists.
# The bundle's version must be the tag's: the release recipe bumps harness/dsh-nanomuse/package.json.
name: harness bundle

on:
  push:
    branches: ["**"]
    paths: ["harness/**", ".github/workflows/harness.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["harness/**", ".github/workflows/harness.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the bundle to this existing release (v0.1.27, say); empty builds only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  bundle:
    name: build · test · pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: harness/dsh-nanomuse/pnpm-lock.yaml
      - name: Install
        working-directory: harness/dsh-nanomuse
        run: pnpm install --frozen-lockfile
      - name: Build, typecheck, test
        working-directory: harness/dsh-nanomuse
        run: |
          pnpm build
          pnpm typecheck
          pnpm test
      - name: Pack
        working-directory: harness/dsh-nanomuse
        env:
          TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$TAG" ] && [ "v$VERSION" != "$TAG" ]; then
            echo "harness/dsh-nanomuse/package.json says $VERSION, the release is $TAG — bump it first" >&2
            exit 1
          fi
          mkdir -p ../../packages
          pnpm pack --pack-destination ../../packages
          mv "../../packages/dsh-nanomuse-$VERSION.tgz" "../../packages/nanoMuse-Harness-$VERSION.tgz"
          (cd ../../packages && sha256sum * > SHA256SUMS-harness.txt && cat SHA256SUMS-harness.txt)
      - name: Install into a fresh dsh profile
        # the tarball, not the source tree: what a person downloads must load as a plugin
        run: |
          mkdir -p /tmp/dsh && cd /tmp/dsh && npm init -y >/dev/null && npm install --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2 >/dev/null
          export DSH_HOME=/tmp/dsh-home
          ./node_modules/.bin/dsh --profile check --from-default-profile web --dump-config >/dev/null
          ./node_modules/.bin/dsh plugin --profile check add "$GITHUB_WORKSPACE"/packages/nanoMuse-Harness-*.tgz
          ./node_modules/.bin/dsh --profile check --dump-config | grep -c "patched by dsh-nanomuse"
      - uses: actions/upload-artifact@v7
        with:
          name: harness-bundle
          path: packages/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: harness-bundle
          path: packages
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # the release is created by scripts/release-apk.sh right after it pushes the tag;
          # give it up to fifteen minutes
          for i in $(seq 1 90); do
            if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          gh release view "$TAG" -R "$REPO" >/dev/null
          gh release upload "$TAG" packages/* -R "$REPO" --clobber
