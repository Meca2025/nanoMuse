# nanoMuse Cloud on nanomuse-hk — the relay only. TLS and the public ports
# belong to the showcase's Caddy on the same box (demo/showcase); this
# container joins its `showcase_edge` network and is reached there as
# `nanomuse-relay:8787` by sites.d/cloud.nanomuse.cn.caddy. Nothing is
# published on the host.
#
# Layout on the server (deploy.sh keeps it so):
#   /opt/nanomuse/relay/docker-compose.yml   this file
#   /opt/nanomuse/relay/.env                 secrets (600, never leaves the box)
#   /opt/nanomuse/relay/src/                 the cloud/ directory of the repository
#   /opt/nanomuse/relay/data/cloud.db        SQLite (backed up by backup.timer)
services:
  relay:
    build: ./src
    image: nanomuse-relay:local
    container_name: nanomuse-relay
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/srv/nanomuse-cloud/data
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  edge:
    external: true
    name: showcase_edge
