<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>nanoMuse</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
  .onetap .card { padding-bottom: 28px; }
  .onetap .status { min-height: 44px; color: var(--ink-2); font-size: 15px; line-height: 22px; margin: 4px 0 18px; }
  .onetap .status.ok { color: var(--ink); font-weight: 600; }
  .onetap .status.bad { color: var(--bad); }
  .onetap .hint { color: var(--ink-3); font-size: 13px; line-height: 19px; margin: 0 0 16px; }
  .onetap .actions { display: grid; gap: 10px; }
  .onetap .spin { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--hairline); border-top-color: var(--action); margin: 6px auto 14px; animation: nm-spin 0.9s linear infinite; }
  @keyframes nm-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app" class="signin onetap" aria-live="polite"></div>
<script src="onetap.js"></script>
</body>
</html>
