# The public nanoMuse showcase: a phone in the browser (MobileGym with the nanoMuse app) and a
# private, short-lived nanoMuse per visitor. See README.md for the whole picture and the
# deployment steps.
#
#   cp .env.example .env && $EDITOR .env
#   docker pull ghcr.io/nano-muse/nanomuse:latest        # what the visitors' sessions run
#   docker compose pull && docker compose up -d          # published images (see showcase.yml)
#   docker compose up -d --build                         # or build both images here
#
# Sessions are started by the gateway on the `nanomuse-sessions` network, which has no way out:
# the only thing a visitor's Muse can talk to is the gateway (and through it, the model).
# With WEB_ENABLED=1 the gateway also runs nanoMuse Web — a kept Muse per Cloud account, on
# the `nanomuse-web` network next to the relay (gateway/showcase_gateway/accounts.py).

services:
  caddy:
    build:
      context: ../..
      dockerfile: demo/showcase/caddy/Dockerfile
      args:
        MOBILEGYM_REF: ${MOBILEGYM_REF:-main}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: ghcr.io/nano-muse/showcase-caddy:${SHOWCASE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_HOST: ${SITE_HOST}
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/mobilegym-data:/srv/cdn:ro
      # other sites on this Caddy: their site blocks, and the files they serve (README, "Other sites")
      - ./sites.d:/etc/caddy/sites.d:ro
      - ${WWW_ROOT:-./www}:/srv/www:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    depends_on:
      - gateway

  gateway:
    build: ./gateway
    image: ghcr.io/nano-muse/showcase-gateway:${SHOWCASE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      INTERNAL_URL: http://gateway:8000
      SESSIONS_NETWORK: nanomuse-sessions
      TRUST_PROXY: "1"
      LISTEN_PORT: "8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gateway-data:/data # trial credentials (SQLite), when TRIAL_ENABLED
    networks:
      - edge
      - sessions
      - web

networks:
  edge: {}
  sessions:
    name: nanomuse-sessions
    internal: true
  # nanoMuse Web (gateway/accounts.py): the kept, per-account containers live here, together
  # with the Cloud relay they sign in to (cloud/deploy/nanomuse-hk joins it too). Not internal:
  # an account's Muse may fetch pages and talk to the model like one on a phone would.
  web:
    name: nanomuse-web

volumes:
  caddy-data: {}
  caddy-config: {}
  gateway-data: {}
