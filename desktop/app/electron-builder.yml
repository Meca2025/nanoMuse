# electron-builder: the installers. `npm run dist` here after scripts/desktop-app/build-runtime.py
# has put the bundled runtime at runtime/ (the CI workflow .github/workflows/desktop-app.yml does
# both, per platform). Nothing is signed: macOS asks for right-click → Open once, Windows for
# "Run anyway" — the same as the terminal binary, see docs/desktop.md.
appId: io.github.nanomuse.desktop
productName: nanoMuse
copyright: GPL-3.0-only · the nanoMuse community
artifactName: nanoMuse-Desktop-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: runtime
    to: runtime
    filter: ["**/*"]
asar: true
compression: normal
publish: null
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # electron-builder would write x86_64 / amd64 here; one name for the site's links
  artifactName: nanoMuse-Desktop-${version}-linux-x64.${ext}
  category: Utility
  icon: resources/app-icon.png
  synopsis: a fully open-source, Muse-style personal agent for every device you own
  desktop:
    entry:
      StartupWMClass: nanoMuse
deb:
  depends: ["libgtk-3-0", "libnotify4", "libnss3", "libxss1", "libxtst6", "xdg-utils", "libatspi2.0-0", "libuuid1", "libsecret-1-0", "xdotool"]
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/app-icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: nanoMuse
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: resources/app-icon.png
  category: public.app-category.productivity
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
dmg:
  writeUpdateInfo: false
