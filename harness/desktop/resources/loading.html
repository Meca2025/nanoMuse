<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:">
<title>nanoMuse</title>
<style>
  /* The splash (C6): the wordmark and a quiet loader; no picture of any character. A face the
     person drew themselves may sit in the disc above the wordmark when the shell hands it over
     (`?face=<data URL>`); otherwise there is no disc. The error state keeps the layout. */
  :root { color-scheme: light dark; --fg: #1b1b1f; --muted: #6b6f76; --bg: #f9f9f9; --err: #b3261e; --dot: #9a9ea6; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f1f1f4; --muted: #9a9ea6; --bg: #171717; --dot: #6b6f76; } }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; -webkit-app-region: drag; user-select: none; }
  .card { text-align: center; max-width: 420px; padding: 24px; }
  .disc { display: none; width: 96px; height: 96px; margin: 0 auto 14px; border-radius: 50%; overflow: hidden; background: rgba(127,127,127,0.12); }
  .disc img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .has-face .disc { display: block; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 10px; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--muted); }
  .loader { display: flex; justify-content: center; gap: 7px; height: 8px; margin: 14px 0 10px; }
  .loader i { width: 7px; height: 7px; border-radius: 50%; background: var(--dot); opacity: 0.25; animation: fade 1.2s ease-in-out infinite; }
  .loader i:nth-child(2) { animation-delay: 0.2s; }
  .loader i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes fade { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .loader i { animation: none; opacity: 0.6; } }
  .error { display: none; color: var(--err); white-space: pre-wrap; text-align: left; font-size: 13px; margin-top: 12px; -webkit-app-region: no-drag; user-select: text; }
  .failed .loader { visibility: hidden; }
  .failed .error { display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="disc"><img id="face" alt="" src=""></div>
    <h1>nanoMuse</h1>
    <div class="loader" aria-hidden="true"><i></i><i></i><i></i></div>
    <p id="line" role="status"></p>
    <p id="error" class="error"></p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var zh = params.get("lang") === "zh" || (!params.get("lang") && /^zh/i.test(navigator.language));
      var line = document.getElementById("line");
      var error = document.getElementById("error");
      // a face of the person's own, as a data URL from the shell; nothing else is ever shown here
      var face = params.get("face") || "";
      if (/^data:image\/(webp|png|jpeg);base64,/.test(face)) {
        var img = document.getElementById("face");
        img.onload = function () { document.body.classList.add("has-face"); };
        img.src = face;
      }
      line.textContent = zh ? "正在启动" : "Starting";
      window.__failed = function (message) {
        document.body.classList.add("failed");
        line.textContent = zh ? "没能启动" : "Could not start";
        error.textContent = message || "";
      };
    })();
  </script>
</body>
</html>
